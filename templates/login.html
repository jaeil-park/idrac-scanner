<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — iDRAC Manager</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:    #0d1117;
    --card:  #161b22;
    --border:#30363d;
    --txt:   #e6edf3;
    --muted: #8b949e;
    --green: #238636;
    --green-h:#2ea043;
    --red:   #f85149;
    --accent:#388bfd;
  }

  body {
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    justify-content: center;
  }

  .logo-icon {
    width: 44px; height: 44px;
    background: var(--green);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  .logo-text { font-size: 1.2rem; font-weight: 700; }
  .logo-sub  { font-size: .75rem; color: var(--muted); margin-top: 2px; }

  h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 24px;
    color: var(--muted);
    text-align: center;
  }

  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: .8rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--txt);
    padding: 10px 12px;
    font-size: .9rem;
    outline: none;
    transition: border-color .15s;
  }

  input:focus { border-color: var(--accent); }

  .error {
    background: rgba(248,81,73,.12);
    border: 1px solid rgba(248,81,73,.3);
    border-radius: 6px;
    color: var(--red);
    padding: 10px 14px;
    font-size: .83rem;
    margin-bottom: 16px;
  }

  button[type=submit] {
    width: 100%;
    background: var(--green);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: .9rem;
    font-weight: 600;
    padding: 11px;
    cursor: pointer;
    margin-top: 8px;
    transition: background .15s;
  }

  button[type=submit]:hover { background: var(--green-h); }

  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: .75rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🖥️</div>
    <div>
      <div class="logo-text">iDRAC Manager</div>
      <div class="logo-sub">Dell iDRAC 통합 관리 도구</div>
    </div>
  </div>
  <h2>로그인이 필요합니다</h2>

  {% if error %}
  <div class="error">⚠ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" autocomplete="username"
             placeholder="admin" autofocus>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit">로그인</button>
  </form>

  <div class="footer">
    AUTH_PASSWORD 환경변수로 비밀번호를 설정합니다
  </div>
</div>
</body>
</html>
